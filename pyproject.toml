[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=3.0"]
build-backend = "scikit_build_core.build"

[project]
name = "smlibpy"
version = "0.6.2"
description = "Python CAD modeling on SMLib, the open-source NURBS solid modeling kernel"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT AND Apache-2.0 AND OFL-1.1"
license-files = ["LICENSE", "NOTICE", "third_party/usd-brep/LICENSE", "src/smlibpy/fonts/OFL.txt"]
authors = [{ name = "AWV Informatik AG" }]
keywords = ["cad", "brep", "nurbs", "solid modeling", "step", "3d", "smlib"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Manufacturing",
  "Intended Audience :: Science/Research",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
  "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
mcp = ["mcp>=1.20", "websockets>=13"]
test = ["pytest>=8", "websockets>=13"]  # (websockets: the live view, of the mcp extra)
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.26"]

# The rest of what CI and the release build install from PyPI: what a build needs (the
# requirements of [build-system]; the ninja and cmake that scikit-build-core asks for where the
# runner has none; build, which makes the sdist) and ci.yml's cross-checks. uv.lock pins these, the
# dependencies and the extras, for every Python and platform, and CI installs them at those
# versions (.github/actions/constraints). Dependabot raises the lock in one pull request a week, so
# that a new release of a package shows up there, alone (pytest 9.2.0 failed every pull request and
# 0.6.1's upload the evening it came out). After changing a requirement here, run `uv lock`.
[dependency-groups]
build = ["scikit-build-core>=0.10", "pybind11>=3.0", "ninja>=1.5", "cmake>=3.15", "build"]
# (where ci.yml installs them and they have wheels: no Python 3.15 yet; usd-core for Linux arm64
# from Python 3.11 on; NVIDIA's validator, which holds usd-core below 26.09, on macOS and on Linux
# x86_64 only, since 26.8 has no wheels for Linux arm64, where the cross-checks take a newer one)
crosscheck = [
  "cadquery-ocp-novtk; sys_platform != 'win32' and python_version < '3.15'",
  "usd-core; python_version < '3.15' and platform_machine != 'aarch64'",
  "usd-core; python_version >= '3.11' and python_version < '3.15' and platform_machine == 'aarch64'",
  "usd-brep[validation]; python_version == '3.12' and sys_platform == 'linux' and platform_machine == 'x86_64'",
  "usd-validation-nvidia[usd]; python_version < '3.15' and (sys_platform == 'darwin' or (sys_platform == 'linux' and platform_machine == 'x86_64'))",
]

[tool.uv]
# The runners' platforms, each resolved on its own, and with wheels for every package in the lock
# for them, so that a pin never turns an install that works into one that fails
environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'linux' and platform_machine == 'aarch64'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
required-environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'linux' and platform_machine == 'aarch64'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[project.scripts]
smlibpy-mcp = "smlibpy.mcp.server:main"

[project.urls]
Homepage = "https://github.com/awv-informatik/smlibpy"
Kernel = "https://github.com/NVIDIA-Omniverse/usd-brep"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"
wheel.packages = ["src/smlibpy"]
sdist.include = ["src/smlibpy/mcp/app", "third_party/usd-brep/source/SMLib", "third_party/usd-brep/source/SM_API", "third_party/usd-brep/source/SmPyLib/src", "third_party/usd-brep/LICENSE", "third_party/usd-brep/THIRD_PARTY_NOTICES.md", "third_party/patches"]
sdist.exclude = ["third_party/usd-brep/TestFiles*", "third_party/usd-brep/tests", "third_party/usd-brep/tools", "third_party/usd-brep/Examples", "out", "build", ".venv*", "uv.lock"]

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-* cp315-*"
skip = "*-musllinux_* *_i686 *-win32"
build-verbosity = 1
test-extras = ["test"]
test-command = "pytest {project}/tests -q"

# No compiler cache: each job of the Release workflow builds the wheels of one Python, so it
# compiles the kernel once (on macOS once for each architecture), and a cache finds nothing to reuse.
[tool.cibuildwheel.macos]
archs = ["arm64", "x86_64"]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

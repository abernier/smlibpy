[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=3.0"]
build-backend = "scikit_build_core.build"

[project]
name = "smlibpy"
version = "0.6.1"
description = "Python CAD modeling on SMLib, the open-source NURBS solid modeling kernel"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT AND Apache-2.0 AND OFL-1.1"
license-files = ["LICENSE", "NOTICE", "third_party/usd-brep/LICENSE", "src/smlibpy/fonts/OFL.txt"]
authors = [{ name = "AWV Informatik AG" }]
keywords = ["cad", "brep", "nurbs", "solid modeling", "step", "3d", "smlib"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Manufacturing",
  "Intended Audience :: Science/Research",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
  "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
mcp = ["mcp>=1.20", "websockets>=13"]
# The tools of the tests and the docs at exact versions, so that a new release of one changes
# nothing until it is raised here: pytest 9.2.0 came out during 0.6.1's upload and failed every
# wheel's tests. CI and the release build test with the test extra (websockets: the live view, of
# the mcp extra; 17 needs Python 3.11). ci.yml's docs job and checks.yml name these versions too.
test = ["pytest==9.2.0", "websockets==17.3; python_version >= '3.11'", "websockets==16.1.1; python_version < '3.11'"]
docs = ["mkdocs-material==9.8.0", "mkdocstrings[python]==1.0.8", "mkdocstrings-python==2.0.10"]

[project.scripts]
smlibpy-mcp = "smlibpy.mcp.server:main"

[project.urls]
Homepage = "https://github.com/awv-informatik/smlibpy"
Kernel = "https://github.com/NVIDIA-Omniverse/usd-brep"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"
wheel.packages = ["src/smlibpy"]
sdist.include = ["src/smlibpy/mcp/app", "third_party/usd-brep/source/SMLib", "third_party/usd-brep/source/SM_API", "third_party/usd-brep/source/SmPyLib/src", "third_party/usd-brep/LICENSE", "third_party/usd-brep/THIRD_PARTY_NOTICES.md", "third_party/patches"]
sdist.exclude = ["third_party/usd-brep/TestFiles*", "third_party/usd-brep/tests", "third_party/usd-brep/tools", "third_party/usd-brep/Examples", "out", "build", ".venv*"]

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-* cp315-*"
skip = "*-musllinux_* *_i686 *-win32"
build-verbosity = 1
test-extras = ["test"]
test-command = "pytest {project}/tests -q"

# No compiler cache: each job of the Release workflow builds the wheels of one Python, so it
# compiles the kernel once (on macOS once for each architecture), and a cache finds nothing to reuse.
[tool.cibuildwheel.macos]
archs = ["arm64", "x86_64"]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

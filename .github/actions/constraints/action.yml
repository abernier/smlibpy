name: uv.lock's versions
description: >-
  Writes the versions of uv.lock as pip constraints, .github/constraints.txt (everything CI
  installs from PyPI) and .github/build-constraints.txt (what a wheel's build asks for), and has
  the job's later pip installs take them. Fails while uv.lock is behind pyproject.toml.
inputs:
  pip:
    description: >-
      "true": PIP_CONSTRAINT and PIP_BUILD_CONSTRAINT for the job's later steps. "false" in the jobs
      of cibuildwheel, which takes the files through its own options (release.yml).
    default: "true"
runs:
  using: composite
  steps:
    # (uv: the version that writes uv.lock, AGENTS.md)
    - uses: astral-sh/setup-uv@v10.3.2
      with:
        version: "0.12.10"
        enable-cache: false
    - name: uv.lock's versions as pip constraints
      shell: bash
      run: |
        # (--offline: the lock and its check need nothing from PyPI)
        export_lock() { uv export --locked --offline --no-hashes --no-emit-project --no-header --no-annotate --format requirements-txt "$@"; }
        export_lock --all-extras --all-groups -o .github/constraints.txt
        # (only what the build asks for itself: cibuildwheel pins its own tools, packaging among
        # them, and two pins of one package clash)
        export_lock --only-group build | grep -E '^(scikit-build-core|pybind11|ninja|cmake)==' > .github/build-constraints.txt
        if [ "${{ inputs.pip }}" = true ]; then
          # (PIP_BUILD_CONSTRAINT: from pip 26.2 on, PIP_CONSTRAINT no longer reaches the isolated
          # environment in which pip builds a package)
          printf '%s\n' "PIP_CONSTRAINT=$GITHUB_WORKSPACE/.github/constraints.txt" \
            "PIP_BUILD_CONSTRAINT=$GITHUB_WORKSPACE/.github/constraints.txt" >> "$GITHUB_ENV"
        fi

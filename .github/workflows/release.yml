name: Release

# Wheels and the sdist are built for every run. Run it by hand (workflow_dispatch) to try
# the build without publishing. Publishing a GitHub release uploads to PyPI through
# trusted publishing (OIDC, environment "pypi"); no API token is involved.

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: The release tag matches the package version
        if: github.event_name == 'release'
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "tag ${GITHUB_REF_NAME} but version ${version}"; exit 1; }
      - name: Build the sdist
        run: pipx run build --sdist
      - name: The sdist builds on its own
        run: |
          python -m venv "$RUNNER_TEMP/from-sdist"
          "$RUNNER_TEMP/from-sdist/bin/pip" install dist/*.tar.gz
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/from-sdist/bin/python" -c "import math, smlibpy as s; v = (s.Box(10, 10, 10) - s.Cylinder(2, 20)).volume; print(v); assert abs(v / (1000 - 40 * math.pi) - 1) < 1e-6"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: dist-sdist
          path: dist/*.tar.gz

  wheels:
    name: wheels ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest builds arm64 and, cross-compiled, x86_64 (see pyproject.toml)
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - uses: pypa/cibuildwheel@v4.2.1
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: dist-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  # Windows compiles the kernel far slower than the others; its wheels follow on their own,
  # into the same release, so the rest need not wait for them
  wheels-windows:
    name: wheels windows-latest
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      # With the Visual Studio generator MSBuild compiled the kernel one file after another,
      # 80 minutes for each wheel. Ninja uses every core, and ccache keeps the kernel for the
      # next Python. Ninja needs the compiler's environment, which vcvars64.bat sets up.
      - name: The compiler's environment, and ccache
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$' -and [Environment]::GetEnvironmentVariable($Matches[1]) -ne $Matches[2]) {
              "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }
          choco install -y --no-progress ccache
      - uses: pypa/cibuildwheel@v4.2.1
        env:
          CIBW_ENVIRONMENT_WINDOWS: CMAKE_GENERATOR=Ninja CXX=cl CMAKE_CXX_COMPILER_LAUNCHER=ccache CCACHE_MAXSIZE=4G
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-wheels
          path: wheelhouse/*.whl

  publish:
    name: publish to PyPI
    needs: [sdist, wheels]
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/smlibpy
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Only wheels and the sdist get uploaded
        run: |
          ls -l dist
          test -z "$(find dist -mindepth 1 ! -name '*.whl' ! -name '*.tar.gz')"
          test -n "$(find dist -name '*.tar.gz')"
      - uses: pypa/gh-action-pypi-publish@v1.14.2

  publish-windows:
    name: publish the Windows wheels to PyPI
    needs: [publish, wheels-windows]
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/smlibpy
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: windows-wheels
          path: dist
      - name: Only wheels get uploaded
        run: |
          ls -l dist
          test -z "$(find dist -mindepth 1 ! -name '*.whl')"
      - uses: pypa/gh-action-pypi-publish@v1.14.2

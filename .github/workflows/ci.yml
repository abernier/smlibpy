name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      only:
        description: The jobs to run (python or js, so that the other does not rebuild)
        type: choice
        options: [all, python, js]
        default: all

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    if: github.event_name != 'workflow_dispatch' || inputs.only != 'js'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install
        run: pip install -v ".[test,mcp]"
      - name: OpenCASCADE for the STEP cross-checks
        if: runner.os != 'Windows'
        continue-on-error: true
        run: pip install cadquery-ocp-novtk
      - name: OpenUSD for the USD cross-checks
        continue-on-error: true
        run: pip install usd-core
      - name: NVIDIA's usd-brep for the USD round trips, with its validator (its wheels are for Python 3.12 on Linux and Windows)
        if: runner.os == 'Linux' && matrix.python == '3.12'
        continue-on-error: true
        run: pip install "usd-brep[validation]"
      - name: Test
        run: pytest -q

  js:
    # smlibwasm: the kernel and smlibpy's C++ compiled to WebAssembly, and the TypeScript port with
    # its tests (js/)
    name: JavaScript (WebAssembly)
    if: github.event_name != 'workflow_dispatch' || inputs.only != 'python'
    runs-on: ubuntu-latest
    env:
      EMSDK_VERSION: 6.0.12
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - uses: actions/cache@v6.1.0
        with:
          path: ~/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}
      - name: Emscripten
        run: |
          [ -d ~/emsdk ] || git clone --depth 1 --branch "$EMSDK_VERSION" https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install "$EMSDK_VERSION"
          ~/emsdk/emsdk activate "$EMSDK_VERSION"
      - name: Build the module
        run: sh js/scripts/build-wasm.sh
      - name: Install
        working-directory: js
        run: npm ci
      - name: Type check
        working-directory: js
        run: npm run typecheck
      - name: Build the package
        working-directory: js
        run: npm run build
      - name: Test
        working-directory: js
        run: npm test

  docs:
    if: github.event_name != 'workflow_dispatch' || inputs.only != 'js'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - run: pip install "mkdocs-material>=9.5" "mkdocstrings[python]>=0.26"
      - run: mkdocs build --strict

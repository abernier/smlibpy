name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      only:
        description: The jobs to run (python or js, so that the other does not rebuild)
        type: choice
        options: [all, python, js]
        default: all

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    if: github.event_name != 'workflow_dispatch' || inputs.only != 'js'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
        include:
          # (the oldest and the newest Python of the wheels)
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.15"
          # (the Linux arm64 wheels: GCC's arithmetic on aarch64, which the other jobs do not see)
          - os: ubuntu-24.04-arm
            python: "3.12"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: ./.github/actions/constraints
      - name: Build and install
        run: pip install -v ".[test,mcp]"
      # The cross-checks where the lock has them (the crosscheck group of pyproject.toml; neither has
      # wheels for Python 3.15 yet). No continue-on-error: their tests skip without them, so a pin that
      # cannot be installed fails the job here instead of turning those tests into quiet skips.
      - name: OpenCASCADE for the STEP cross-checks
        if: runner.os != 'Windows' && matrix.python != '3.15'
        run: pip install cadquery-ocp-novtk
      - name: OpenUSD for the USD cross-checks
        if: matrix.python != '3.15'
        run: pip install usd-core
      # NVIDIA's validator itself (tests/test_closeout_W.py, N4): usd-brep's wheel brings it where it has
      # wheels; on macOS OpenUSD and the asset validator from PyPI, with the submodule's BrepArray rules.
      # No continue-on-error, and SMLIBPY_REQUIRE_USD_VALIDATOR below fails its tests instead of skipping
      # them: a green run of these jobs is a run of the validator.
      - name: NVIDIA's usd-brep for the USD round trips, with its validator (its wheels are for Python 3.12 on Linux and Windows)
        if: runner.os == 'Linux' && runner.arch == 'X64' && matrix.python == '3.12'
        run: pip install "usd-brep[validation]"
      - name: NVIDIA's USD validator (OpenUSD and the asset validator; the BrepArray rules are the submodule's)
        if: runner.os == 'macOS'
        run: pip install "usd-validation-nvidia[usd]"
      - name: Test
        env:
          SMLIBPY_REQUIRE_USD_VALIDATOR: ${{ (runner.os == 'macOS' || (runner.os == 'Linux' && runner.arch == 'X64' && matrix.python == '3.12')) && '1' || '' }}
        run: pytest -q

  js:
    # smlibwasm: the kernel and smlibpy's C++ compiled to WebAssembly, and the TypeScript port with
    # its tests (js/); then smlibpy-three, smlibwasm's API for three.js, on it (smlibpy-three/)
    name: JavaScript (WebAssembly)
    if: github.event_name != 'workflow_dispatch' || inputs.only != 'python'
    runs-on: ubuntu-latest
    env:
      EMSDK_VERSION: 6.0.12
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - uses: actions/cache@v6.1.0
        with:
          path: ~/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}
      - name: Emscripten
        run: |
          [ -d ~/emsdk ] || git clone --depth 1 --branch "$EMSDK_VERSION" https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install "$EMSDK_VERSION"
          ~/emsdk/emsdk activate "$EMSDK_VERSION"
      - name: Build the module
        run: sh js/scripts/build-wasm.sh
      - name: Install
        working-directory: js
        run: npm ci
      - name: Type check
        working-directory: js
        run: npm run typecheck
      - name: Build the package
        working-directory: js
        run: npm run build
      # NVIDIA's validator itself on toUsd's files (js/test/closeout_W.test.ts, N4), which fails rather
      # than skips without it; the BrepArray rules are the submodule's
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - uses: ./.github/actions/constraints
      - name: NVIDIA's USD validator (OpenUSD and the asset validator)
        run: pip install "usd-validation-nvidia[usd]"
      - name: Test
        working-directory: js
        env:
          SMLIBPY_REQUIRE_USD_VALIDATOR: "1"
        run: npm test
      - name: smlibpy-three, install
        working-directory: smlibpy-three
        run: npm ci
      - name: smlibpy-three, type check
        working-directory: smlibpy-three
        run: npm run typecheck
      - name: smlibpy-three, test
        working-directory: smlibpy-three
        run: npm test
      - name: smlibpy-three, build
        working-directory: smlibpy-three
        run: npm run build
      # (the API section of docs/three.md is written from the declarations just built: it must be
      # what they say, as smlibwasm's in docs/javascript.md is, which js/test/lane_WN.test.ts checks)
      - name: smlibpy-three, the API section of docs/three.md is current
        working-directory: smlibpy-three
        run: npm run api && git diff --exit-code -- ../docs/three.md

  docs:
    if: github.event_name != 'workflow_dispatch' || inputs.only != 'js'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - uses: ./.github/actions/constraints
      - run: pip install mkdocs-material "mkdocstrings[python]"
      - run: mkdocs build --strict

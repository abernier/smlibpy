site_name: smlibpy
site_description: Python CAD modeling on SMLib, the open-source NURBS solid modeling kernel
repo_url: https://github.com/awv-informatik/smlibpy
repo_name: awv-informatik/smlibpy
edit_uri: edit/main/docs/

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Concepts: concepts.md
  - Sketches: sketches.md
  - Parts: parts.md
  - Features: features.md
  - Deformations: deform.md
  - Selecting: selecting.md
  - Surfaces: surfaces.md
  - Sheet metal: sheet-metal.md
  - Measuring: analysis.md
  - Files and viewer: files.md
  - AI agents (MCP): mcp.md
  - JavaScript (WASM): javascript.md
  - three.js: three.md
  - Examples: examples.md
  - The kernel: kernel.md
  - API:
      - Python: api/index.md
      - WASM: api/wasm.md
      - three.js: api/three.md

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.tabs.link
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Light mode
  font:
    text: Inter
    code: JetBrains Mono

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            show_signature_annotations: true
            separate_signature: true
            filters: ["!^_"]
            heading_level: 3
